# Traductions de l'interface (flutter gen-l10n, lancé automatiquement par
# `flutter pub get` / `flutter run`). Le français est la langue de référence :
# toute nouvelle clé s'ajoute d'abord dans app_fr.arb, puis dans app_en.arb.
arb-dir: lib/l10n
output-dir: lib/l10n
template-arb-file: app_fr.arb
output-localization-file: app_localizations.dart
nullable-getter: false
untranslated-messages-file: build/untranslated_messages.txt
